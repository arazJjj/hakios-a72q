# devices/a72q/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device a72q
	title       Samsung Galaxy A72 (SM-A725F)
	vendor      Samsung
	soc         sm7125
	defconfig   a72q_defconfig
	maintainer  Russell
	status      gpu         partial   Adreno 618 port, first stage: overlay/drivers/gpu/hakios.adreno.c, steps 1 to 9 (adreno=N); not yet run
	status      display     partial   UEFI's framebuffer, through the loader (to be checked)
	status      wifi        missing   redwood ships an ath11k port for WCN6750; the A72 most likely has a WCN399x (ath10k snoc), so it needs a new port. Pull fw-wifi/ from the phone first
	status      cellular    missing   the common modem driver cannot register even on redwood yet
	status      touch       partial   hakios.stmfts.c v2 (clocks, pins, RPMh supplies, FIFO mode) for the FTS5CU56A on I2C; built in, not yet run on the phone (touchscreen=1)
