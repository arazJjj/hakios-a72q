# devices/a72q/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device a72q
	title       Samsung Galaxy A72 (SM-A725F)
	vendor      Samsung
	soc         sm7125
	defconfig   a72q_defconfig
	maintainer  Russell
	status      display     partial   UEFI's framebuffer, through the loader (to be checked)
