# Turn an iOS release's system.apfs.zst parts into ramdisk.img (raw, uncompressed) for `xl ramdisk ramdisk.img`.
# GitHub caps one release file at 2 GiB, so it is published as ramdisk.img.part00, part01...: join with cat.
name: ramdisk-img
on:
  workflow_dispatch:
    inputs:
      ios_tag:
        description: "iOS release to convert"
        default: "ios-20F66-run2"
jobs:
  img:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse on a public repository
        run: |
          vis=$(gh api repos/${{ github.repository }} --jq .visibility)
          [ "$vis" = private ] || { echo "repository is $vis"; exit 1; }
      - name: Build ramdisk.img
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          mkdir w && cd w
          gh release download "${{ inputs.ios_tag }}" -p 'system.apfs.zst*' -R ${{ github.repository }}
          if ls system.apfs.zst.part* >/dev/null 2>&1; then cat system.apfs.zst.part* > system.apfs.zst; fi
          rm -f system.apfs.zst.part*
          zstd -d --rm system.apfs.zst -o ramdisk.img
          ls -la ramdisk.img
          split -b 1900M -d ramdisk.img ramdisk.img.part
          rm ramdisk.img
          sha256sum ramdisk.img.part* > SHA256SUMS
      - name: Publish
        run: |
          cd w
          tag="ramdisk-${{ inputs.ios_tag }}"
          gh release create "$tag" ramdisk.img.part* SHA256SUMS -R ${{ github.repository }} \
            --title "ramdisk.img (${{ inputs.ios_tag }})" \
            --notes "Join: cat ramdisk.img.part* > ramdisk.img  Then: ./xl ramdisk ramdisk.img"
