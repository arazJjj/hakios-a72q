# HakiOS a72q: build root.apfs + system.apfs (iOS 16.5) on GitHub's servers.
# Actions tab -> "Build iOS images" -> Run workflow. About 30 min.
# The result goes to a Release of this private repo (release files don't use your storage quota).
# Keep the repo private: the images are built from Apple's IPSW and must not be shared.
name: Build iOS images

on:
  workflow_dispatch:
    inputs:
      device:
        description: "IPSW device (ipsw.me identifier)"
        default: "iPhone10,3"
      build:
        description: "iOS build (20F66 = 16.5)"
        default: "20F66"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Stop if the repo is public
        if: ${{ !github.event.repository.private }}
        run: |
          echo "This repo is public. Make it private first: the images are Apple's and must not be shared." >&2
          exit 1

      - name: Free disk space (the IPSW and its unpacked files need about 25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Build
        env:
          WORK: ${{ runner.temp }}/hakios
        run: |
          sed -i "s/tools\/fetch-ipsw.sh iPhone10,3 20F66/tools\/fetch-ipsw.sh ${{ inputs.device }} ${{ inputs.build }}/" codespace-build.sh
          bash codespace-build.sh

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-${{ inputs.build }}-run${{ github.run_number }}"
          gh release create "$TAG" out/* \
            --title "iOS ${{ inputs.build }} images (run ${{ github.run_number }})" \
            --notes "root.apfs and system.apfs, zstd. If split: cat system.apfs.zst.part* > system.apfs.zst, then zstd -d. Check with SHA256SUMS."
